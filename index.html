<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSX2K - Sosyal Medyada Patlama Zamanı</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:15px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:460px;margin:auto}
.logo{font-size:24px;font-weight:900}
.logo span{color:#00e676}
.card{background:#1c1c1c;padding:18px;border-radius:18px;max-width:460px;margin:15px auto}
input,select{width:100%;padding:13px;border-radius:12px;border:0;margin-top:10px;background:#2a2a2a;color:#fff;font-size:15px}
button{width:100%;padding:14px;border-radius:12px;border:0;margin-top:10px;font-weight:800;font-size:16px;cursor:pointer}
.btn-green{background:#00e676;color:#000}
.btn-white{background:#fff;color:#000}
.btn-gray{background:#333;color:#fff}
.btn-wa{background:#25D366;color:#000}
.hidden{display:none}
.small{font-size:13px;opacity:.75;line-height:1.5}
.badge{background:#00e676;color:#000;padding:5px 10px;border-radius:20px;font-weight:800;font-size:13px}
.row{display:flex;gap:10px}
.row button{flex:1}
.center{text-align:center}
.wa-float{display:block;text-align:center;background:#25D366;color:#000;padding:13px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:10px}
</style>
</head>
<body>

<div class="top">
<div class="logo">RSX<span>2K</span> 🔥</div>
<div id="userTop"></div>
</div>
<p class="center small">WhatsApp: +964 751 204 4863</p>

<!-- GİRİŞ / KAYIT -->
<div class="card" id="authCard">
<h2 class="center">Giriş Yap / Kayıt Ol</h2>
<input id="authUser" placeholder="Kullanıcı adın">
<input id="authPass" type="password" placeholder="Şifren">
<div class="row">
<button class="btn-green" onclick="login()">Giriş Yap</button>
<button class="btn-white" onclick="register()">Kayıt Ol</button>
</div>
<p class="small center" id="authMsg"></p>
</div>

<!-- PANEL -->
<div class="card hidden" id="panelCard">
<p>Bakiyen: <span class="badge" id="balanceText">0 TL</span></p>
<p>Hoşgeldin <b id="helloUser"></b> 👋</p>
<h3>Sipariş Ver</h3>
<select id="platform">
<option value="TikTok Takipçi">TikTok - Takipçi</option>
<option value="TikTok Beğeni">TikTok - Beğeni</option>
<option value="TikTok İzlenme">TikTok - İzlenme</option>
<option value="Instagram Takipçi">Instagram - Takipçi</option>
<option value="Instagram Beğeni">Instagram - Beğeni</option>
<option value="Instagram İzlenme">Instagram - İzlenme</option>
</select>
<input id="targetUser" placeholder="@hedef kullanıcı adı">
<input id="amount" type="number" value="100" placeholder="Adet">
<p>Toplam: <b id="totalText">100 TL</b></p>
<button class="btn-green" onclick="payWithStripe()">💳 Kart ile Öde (Stripe)</button>
<button class="btn-wa" onclick="orderWhatsapp()">WhatsApp ile Sipariş</button>
<button class="btn-gray" onclick="showChangePass()">🔑 Şifre Değiştir</button>
<button class="btn-gray" onclick="logout()">Çıkış Yap</button>
<p class="small" id="orderMsg"></p>
</div>

<!-- ŞİFRE DEĞİŞTİR - DÜZELTİLDİ -->
<div class="card hidden" id="passCard">
<h3 class="center">Şifre Değiştir</h3>
<input id="oldPass" type="password" placeholder="Eski şifren">
<input id="newPass" type="password" placeholder="Yeni şifren">
<input id="newPass2" type="password" placeholder="Yeni şifren (tekrar)">
<button class="btn-green" onclick="changePassword()">Şifreyi Güncelle</button>
<button class="btn-gray" onclick="hideChangePass()">Vazgeç</button>
<p class="small center" id="passMsg"></p>
</div>

<!-- BAKİYE YÜKLE -->
<div class="card" id="topupCard">
<h3 class="center">Bakiye Yükle</h3>
<p class="small center">Kart ile yükle, bakiyen hesabında kalsın.</p>
<div class="row">
<button class="btn-white" onclick="setTopup(100)">100 TL</button>
<button class="btn-white" onclick="setTopup(250)">250 TL</button>
<button class="btn-white" onclick="setTopup(500)">500 TL</button>
</div>
<input id="topupAmount" type="number" value="100">
<button class="btn-green" onclick="topupStripe()">💳 Bakiye Yükle</button>
<p class="small center" id="topupMsg"></p>
<a class="wa-float" href="https://wa.me/9647512044863?text=Selam%20RSX2K%2C%20bakiye%20y%C3%BCklemek%20istiyorum">WhatsApp: +964 751 204 4863</a>
</div>

<script>
// ============ AYARLAR ============
// Cloudflare Worker linkini buraya yaz
const WORKER_URL = "https://rsx2k-sitem.workers.dev";
const WA_NUMBER = "9647512044863";

// ============ KULLANICI + BAKİYE - DÜZELTİLDİ ============
function getUsers(){ try{ return JSON.parse(localStorage.getItem("rsx_users")||"{}"); }catch(e){ return {}; } }
function saveUsers(u){ localStorage.setItem("rsx_users", JSON.stringify(u)); }
function getBalances(){ try{ return JSON.parse(localStorage.getItem("rsx_balances")||"{}"); }catch(e){ return {}; } }
function saveBalances(b){ localStorage.setItem("rsx_balances", JSON.stringify(b)); }
function currentUser(){ return localStorage.getItem("rsx_current"); }

function getBalance(user){
  const b = getBalances();
  if(b[user] === undefined) b[user] = 0;
  return b[user];
}
function setBalance(user, val){
  const b = getBalances();
  b[user] = val;
  saveBalances(b);
  updateUI();
}
function updateUI(){
  const u = currentUser();
  if(!u) return;
  document.getElementById("balanceText").innerText = getBalance(u) + " TL";
  document.getElementById("helloUser").innerText = u;
  document.getElementById("userTop").innerHTML = "<span class='badge'>"+getBalance(u)+" TL</span>";
}
function register(){
  const u = document.getElementById("authUser").value.trim();
  const p = document.getElementById("authPass").value;
  if(!u || !p) return document.getElementById("authMsg").innerText = "Kullanıcı adı ve şifre yaz kanka.";
  const users = getUsers();
  if(users[u]) return document.getElementById("authMsg").innerText = "Bu kullanıcı zaten var, giriş yap.";
  users[u] = p;
  saveUsers(users);
  const b = getBalances(); if(b[u]===undefined){ b[u]=0; saveBalances(b); }
  document.getElementById("authMsg").innerText = "Kayıt oldun ✅ Şimdi giriş yap.";
}
function login(){
  const u = document.getElementById("authUser").value.trim();
  const p = document.getElementById("authPass").value;
  const users = getUsers();
  if(users[u] && users[u] === p){
    localStorage.setItem("rsx_current", u);
    showPanel();
  } else {
    document.getElementById("authMsg").innerText = "Kullanıcı adı veya şifre yanlış.";
  }
}
function showPanel(){
  document.getElementById("authCard").classList.add("hidden");
  document.getElementById("panelCard").classList.remove("hidden");
  updateUI();
}
function logout(){ localStorage.removeItem("rsx_current"); location.reload(); }
if(currentUser() && getUsers()[currentUser()]){ showPanel(); }

// ============ ŞİFRE DEĞİŞTİR - DÜZELTİLDİ ============
function showChangePass(){ document.getElementById("passCard").classList.remove("hidden"); window.scrollTo(0, document.body.scrollHeight); }
function hideChangePass(){ document.getElementById("passCard").classList.add("hidden"); }
function changePassword(){
  const u = currentUser();
  const oldP = document.getElementById("oldPass").value;
  const newP = document.getElementById("newPass").value;
  const newP2 = document.getElementById("newPass2").value;
  const users = getUsers();
  if(!u) return document.getElementById("passMsg").innerText = "Önce giriş yap.";
  if(users[u] !== oldP) return document.getElementById("passMsg").innerText = "Eski şifren yanlış kanka.";
  if(!newP || newP.length < 4) return document.getElementById("passMsg").innerText = "Yeni şifre en az 4 karakter olsun.";
  if(newP !== newP2) return document.getElementById("passMsg").innerText = "Yeni şifreler uyuşmuyor.";
  if(newP === oldP) return document.getElementById("passMsg").innerText = "Yeni şifre eskisiyle aynı olamaz.";
  users[u] = newP;
  saveUsers(users);
  document.getElementById("passMsg").innerText = "Şifren değişti ✅ Artık yeni şifrenle giriş yapacaksın.";
  document.getElementById("oldPass").value=""; document.getElementById("newPass").value=""; document.getElementById("newPass2").value="";
}

// ============ ÖDEME ============
document.getElementById("amount").addEventListener("input", e=>{
  document.getElementById("totalText").innerText = (e.target.value||0) + " TL";
});
function setTopup(v){ document.getElementById("topupAmount").value = v; }

async function payWithStripe(){
  const u = currentUser();
  const target = document.getElementById("targetUser").value.trim();
  const amount = Number(document.getElementById("amount").value || 0);
  const platform = document.getElementById("platform").value;
  if(!u) return document.getElementById("orderMsg").innerText = "Önce giriş yap.";
  if(!target) return document.getElementById("orderMsg").innerText = "Hedef kullanıcı adını yaz.";
  if(amount < 1) return document.getElementById("orderMsg").innerText = "Adet yaz.";
  document.getElementById("orderMsg").innerText = "Ödeme sayfası açılıyor...";
  try{
    const res = await fetch(WORKER_URL + "/create-checkout-session", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ amount: amount, username: target + " - " + platform })
    });
    const data = await res.json();
    if(data.url){ window.location.href = data.url; }
    else { document.getElementById("orderMsg").innerText = "Stripe hatası: " + (data.error || JSON.stringify(data)); }
  }catch(e){ document.getElementById("orderMsg").innerText = "Bağlantı hatası, WhatsApp ile dene."; }
}
async function topupStripe(){
  const amount = Number(document.getElementById("topupAmount").value || 0);
  const u = currentUser() || "misafir";
  if(amount < 10) return document.getElementById("topupMsg").innerText = "En az 10 TL yükleyebilirsin.";
  document.getElementById("topupMsg").innerText = "Ödeme sayfası açılıyor...";
  try{
    const res = await fetch(WORKER_URL + "/create-checkout-session", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ amount: amount, username: "Bakiye Yükle - " + u })
    });
    const data = await res.json();
    if(data.url){ window.location.href = data.url; }
    else { document.getElementById("topupMsg").innerText = "Stripe hatası: " + (data.error || "Bilinmeyen hata"); }
  }catch(e){ document.getElementById("topupMsg").innerText = "Bağlantı hatası."; }
}
function orderWhatsapp(){
  const target = document.getElementById("targetUser").value || "";
  const amount = document.getElementById("amount").value || "";
  const platform = document.getElementById("platform").value;
  const msg = encodeURIComponent("Merhaba RSX2K! Sipariş: " + platform + " | Hedef: " + target + " | Adet: " + amount);
  window.open("https://wa.me/" + WA_NUMBER + "?text=" + msg, "_blank");
}
</script>
</body>
</html>
